<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}盲评揭盲{% endblock %}</title>
  <style>
    body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
           margin: 2rem auto; max-width: 960px; padding: 0 1rem; color: #222; }
    nav { margin-bottom: 1rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
    th { background: #f3f3f3; }
    .flash-ok { background: #e6f7e6; border: 1px solid #8c8; padding: .5rem .8rem; margin: .5rem 0; }
    .flash-error { background: #fde8e8; border: 1px solid #c88; padding: .5rem .8rem; margin: .5rem 0; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: .6rem; font-size: .85em; }
    .ok { background: #e6f7e6; color: #264; }
    .warn { background: #fdf3e0; color: #852; }
    .done { background: #e3ecfd; color: #247; }
    fieldset { margin: 1rem 0; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <nav><a href="{{ url_for('index') }}">场次列表</a></nav>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
